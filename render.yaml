services:
  - type: web
    name: resume-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: OPENAI_FALLBACK_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: AFFINDA_API_KEY
        sync: false
      - key: AFFINDA_API_BASE_URL
        value: https://resume-parser.affinda.com
      - key: AFFINDA_ORGANIZATION_ID
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_CALLBACK_URL
        sync: false
      - key: AUTH0_LOGOUT_RETURN_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
