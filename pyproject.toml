[project]
name = "resume-analyzer"
version = "0.1.0"
description = "A private Flask resume analysis workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4.0",
    "google-genai>=3.6.1,<4.0.0",
    "gunicorn>=22.0,<24.0",
    "huggingface-hub>=0.26,<1.0",
    "numpy>=1.24,<3.0",
    "onnxruntime>=1.20,<2.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "tokenizers>=0.20,<1.0",
    "python-dotenv==1.0.0",
]
